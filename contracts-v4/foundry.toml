[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
cbor_metadata = false
ffi = false
fs_permissions = [{ access = "read", path = "./test/fixtures" }]
gas_limit = 100000000
block_timestamp = 1800000000
verbosity = 2

[fuzz]
runs = 1000
seed = "0x706f636b6574"

[invariant]
runs = 64
depth = 30
fail_on_revert = false
show_metrics = false

# CI profile: fuzz >= 10,000 runs, invariants 256 runs x depth 50.
# Run with: FOUNDRY_PROFILE=ci forge test
[profile.ci]
verbosity = 1

[profile.ci.fuzz]
runs = 10000
seed = "0x706f636b6574"

[profile.ci.invariant]
runs = 256
depth = 50
fail_on_revert = false

# Coverage profile: no optimizer so source maps stay precise.
[profile.coverage]
optimizer = false

[lint]
severity = ["high", "med"]
exclude_lints = ["unsafe-typecast", "block-timestamp", "arbitrary-send-eth"]

# Real-crypto profile: ML-DSA-87 keys and signatures made at test time and a pqcVerify stand-in that runs the real
# algorithm (vm.ffi -> script/ffi/mldsa.mjs). Needs Node 20+ and `npm ci` in contracts-v4.
# Run with: FOUNDRY_PROFILE=realcrypto forge test
[profile.realcrypto]
test = "test-real"
ffi = true

# Live profile: Foundry tests that reach the LIVE Diana precompiles 0x0A01 / 0x0A02 (eth_call only, spends nothing).
# Run with: FOUNDRY_PROFILE=live forge test   (needs network access to the Diana EVM RPC)
[profile.live]
test = "test-live"
ffi = true

[rpc_endpoints]
diana = "https://evm-testnet.qore.host"
