name: renew-window
# Manual only since 2026-11-22. Relays now go out as hybrid-signed MsgCrossVMCall (secp256k1 + ML-DSA-87), which need no
# EVM window, so the window was left to close and the classical (ECDSA-only) relay path is shut by the chain itself.
# This workflow stays as the operator fallback: run it by hand to re-open the scoped window (prod router, lab router,
# v3 PocketDrop) if the hybrid lane ever has to be switched off (RELAY_MODE=evm on the API).
on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Renew even if the window is healthy'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: renew-window
  cancel-in-progress: false
jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Renew window if below 8,000 blocks or not live
        working-directory: backend
        env:
          RELAYER_SECP_KEY: ${{ secrets.RELAYER_SECP_KEY }}
          RELAYER_PQC_SEED: ${{ secrets.RELAYER_PQC_SEED }}
          # v4: PocketRouter (prod), PocketRouter (lab), PocketDrop v3 (kept for the v3 flows)
          WINDOW_TARGETS: '0x13b8e379e50da657b943781d2816fc17473ae376,0x6de5f7d06e5a4c9563d405b39c192d8d2de1be75,0xb0d8fd2379e06ed5d48371b41baa6dd0a31cf209,0x0b4ee3c8a7a63716c5700b2711ad57a461b7ac2d,0x29F53b4B8031E7bA1785dC8C7a1C0Be413a4bd97'
          FORCE: ${{ inputs.force }}
        run: |
          THRESHOLD=8000
          if [ "$FORCE" = "true" ]; then THRESHOLD=1000000000; fi
          node scripts/renew-window.mjs --blocks 17280 --txs 500 --if-below "$THRESHOLD"
      - name: Check public health
        run: |
          curl -fsS https://pocketdrop-api.vercel.app/api/health | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const h=JSON.parse(s);console.log('live',h.window?.live,'remainingBlocks',h.window?.remainingBlocks);if(!h.window?.live)process.exit(1)})"
