name: ci
# Contracts (Foundry), frontend and backend unit tests, and the read-only chain re-verification from /judges.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: contracts-v4 } }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install-foundry
      - run: forge --version
      - run: forge test -vv
      - name: committed ABIs (read by the Node attack script) match the build
        run: node script/export-abi.mjs --check
  contracts-realcrypto:
    # Real ML-DSA-87 at test time (vm.ffi -> script/ffi/mldsa.mjs); pqcVerify replaced by the real algorithm, no mock.
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: contracts-v4 } }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install-foundry
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: contracts-v4/package-lock.json }
      - run: npm ci
      - run: FOUNDRY_PROFILE=realcrypto forge test -vv
      - name: the suite catches an accept-all verifier (not vacuous)
        run: ./script/ffi/mutation-check.sh
  contracts-live:
    # Same contracts against the LIVE Diana precompiles 0x0A01 / 0x0A02, eth_call only (no key, no QOR).
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: contracts-v4 } }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install-foundry
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: contracts-v4/package-lock.json }
      - run: npm ci
      - run: FOUNDRY_PROFILE=live forge test -vv
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
  reverify:
    # exactly what /judges tells a reviewer to run: plain Node, no install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node frontend/scripts/reverify.mjs
